<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DFD</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
    }

    .header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 16px 20px;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      object-fit: contain;
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
      color: #7c83fd;
      letter-spacing: 0.5px;
    }

    .header-sub {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
    }

    .status-bar {
      padding: 8px 20px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0a0a14;
      border-bottom: 1px solid #1a1a2e;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #555;
    }

    .status-dot.online  { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
    .status-dot.offline { background: #f44336; }
    .status-dot.checking { background: #ff9800; animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .content {
      padding: 16px 20px;
    }

    .video-info {
      background: #1a1a2e;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #2a2a4a;
      font-size: 12px;
      color: #aaa;
      word-break: break-all;
      display: none;
    }

    .video-info.visible { display: block; }

    .video-info strong {
      color: #7c83fd;
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-analyse {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #7c83fd, #5c6bc0);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.5px;
    }

    .btn-analyse:hover:not(:disabled) {
      background: linear-gradient(135deg, #9c9fff, #7c83fd);
      transform: translateY(-1px);
    }

    .btn-analyse:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }


    .loading {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .loading.visible {
      display: block !important;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #2a2a4a;
      border-top-color: #7c83fd;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 13px;
      color: #888;
    }

    .result-card {
      display: none;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 12px;
      border: 1px solid #2a2a4a;
    }

    .result-card.visible { display: block; }

    .result-header {
      padding: 16px;
      text-align: center;
    }

    .result-header.real       { background: linear-gradient(135deg, #1b3a2b, #0d2818); border-bottom: 2px solid #4caf50; }
    .result-header.fake       { background: linear-gradient(135deg, #3a1b1b, #280d0d); border-bottom: 2px solid #f44336; }
    .result-header.suspicious { background: linear-gradient(135deg, #3a2d1b, #281e0d); border-bottom: 2px solid #ff9800; }
    .result-header.inconclusive { background: linear-gradient(135deg, #1a1a2e, #0f0f1a); border-bottom: 2px solid #666; }

    .result-verdict {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .result-verdict.real       { color: #4caf50; }
    .result-verdict.fake       { color: #f44336; }
    .result-verdict.suspicious { color: #ff9800; }
    .result-verdict.inconclusive { color: #888; }

    .result-confidence {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }


    .result-reason {
      padding: 12px 16px;
      font-size: 12px;
      color: #bbb;
      line-height: 1.6;
      background: #12121f;
      border-bottom: 1px solid #2a2a4a;
    }


    .model-breakdown {
      padding: 12px 16px;
      background: #0f0f1a;
    }

    .breakdown-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #555;
      margin-bottom: 10px;
    }

    .model-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      border-radius: 6px;
      background: #1a1a2e;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .model-name {
      color: #888;
      font-weight: 500;
    }

    .model-detail {
      color: #aaa;
      font-size: 11px;
      text-align: right;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge.real       { background: #1b3a2b; color: #4caf50; }
    .badge.fake       { background: #3a1b1b; color: #f44336; }
    .badge.suspicious { background: #3a2d1b; color: #ff9800; }
    .badge.inconclusive { background: #1a1a2e; color: #888; }


    .error-box {
      display: none;
      background: #3a1b1b;
      border: 1px solid #f44336;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      color: #f88;
      margin-top: 12px;
      line-height: 1.5;
    }

    .error-box.visible { display: block; }


    .no-video {
      text-align: center;
      padding: 20px 0;
      font-size: 12px;
      color: #555;
    }

    .no-video-icon { font-size: 28px; margin-bottom: 8px; }


    .footer {
      padding: 10px 20px;
      font-size: 10px;
      color: #333;
      text-align: center;
      border-top: 1px solid #1a1a2e;
    }
  </style>
</head>
<body>

  <div class="header">
    <img class="header-icon" src="logo.png" alt="DFD Logo">
    <div>
      <div class="header-title">DFD</div>
      <div class="header-sub">Deepfake Detection Tool</div>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-dot checking" id="statusDot"></div>
    <span id="statusText">Checking backend...</span>
  </div>

  <div class="content">

    <!-- video detected info -->
    <div class="video-info" id="videoInfo">
      <strong>Video detected</strong>
      <span id="videoUrl"></span>
    </div>

    <!-- no video found -->
    <div class="no-video" id="noVideo" style="display:none">
      <div class="no-video-icon">🎬</div>
      <div>No video detected on this page.<br>Navigate to a video on YouTube, TikTok, Instagram, X or Facebook.</div>
    </div>

    <!-- analyse button -->
    <button class="btn-analyse" id="btnAnalyse" disabled>
      Analyse This Video
    </button>

    <!-- loading stats -->
    <div class="loading" id="loading" style="display:none">
      <div class="spinner"></div>
      <div class="loading-text" id="loadingText">Scanning...</div>
    </div>

    <!-- result card -->
    <div class="result-card" id="resultCard">
      <div class="result-header" id="resultHeader">
        <div class="result-verdict" id="resultVerdict">ANALYSING</div>
        <div class="result-confidence" id="resultConfidence"></div>
      </div>

      <div class="result-reason" id="resultReason"></div>

      <div class="model-breakdown">
        <div class="breakdown-title">Model Breakdown</div>

        <div class="model-row">
          <div>
            <div class="model-name">Visual (EAR)</div>
            <div class="model-detail" id="earDetail"></div>
          </div>
          <span class="badge" id="earBadge">—</span>
        </div>

        <div class="model-row">
          <div>
            <div class="model-name">Audio</div>
            <div class="model-detail" id="audioDetail"></div>
          </div>
          <span class="badge" id="audioBadge">—</span>
        </div>
      </div>
    </div>

    <!-- error box -->
    <div class="error-box" id="errorBox"></div>

  </div>

  <div class="footer">
    Amber Lynch (001313385) — University of Greenwich FYP
  </div>

  <script src="popup.js"></script>
</body>
</html>
